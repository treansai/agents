services:
  agents:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - agent-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  agent-data:

